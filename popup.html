<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearspace</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="24" height="24" alt="">
      <strong>Clearspace</strong>
    </header>
    <label class="site-row" for="enabled">
      <span class="site">
        <span id="hostname" class="hostname" title="" hidden></span>
        <span id="site-status" class="status" role="status">Checking current page...</span>
      </span>
      <input id="enabled" type="checkbox" role="switch" aria-label="Clean up this site" aria-describedby="hostname" disabled>
    </label>
    <div id="recovery" class="recovery" hidden>
      <button id="reload" type="button">Reload page</button>
    </div>
    <details>
      <summary>Updates</summary>
      <div class="updates">
        <p>Rules update automatically.</p>
        <p id="refresh-result" role="status" hidden></p>
        <p id="refresh-reassurance" hidden>Saved rules are still active.</p>
        <button id="refresh" type="button">Check now</button>
      </div>
    </details>
    <script type="module" src="popup.js"></script>
  </body>
</html>
