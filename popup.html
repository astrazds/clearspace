<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearspace</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/icon32.png" width="28" height="28" alt="">
      <div><strong>Clearspace</strong><span id="hostname">Checking current page…</span></div>
    </header>
    <label class="toggle-row" for="enabled">
      <span><strong>Clean up this site</strong><small id="scope-note">Exact hostname preference</small></span>
      <input id="enabled" type="checkbox" disabled>
    </label>
    <section aria-labelledby="sources-title">
      <h2 id="sources-title">Rule sources</h2>
      <dl>
        <div><dt>Hagezi Pro</dt><dd id="hagezi-status">Loading…</dd></div>
        <div><dt>EasyList</dt><dd id="easylist-status">Loading…</dd></div>
      </dl>
      <p id="refresh-result" role="status"></p>
      <button id="refresh" type="button">Refresh now</button>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
