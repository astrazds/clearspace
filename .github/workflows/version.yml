name: Version merged PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clearspace-version-main
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Never checkout a workflow_run head SHA or download its artifacts. Only main is trusted.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise run install:browser -- --with-deps
      - name: Reconcile every unprocessed merged PR and verify before pushing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/version-main.mjs
